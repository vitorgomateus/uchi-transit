<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Transit</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── Config screen ───────────────────────────────────── */
    #cfg {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; gap: 16px;
    }
    #cfg h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #cfg p  { color: #8e8e93; font-size: 15px; text-align: center; line-height: 1.5; max-width: 360px; }

    #cfg-ta {
      width: 100%; max-width: 480px; height: 200px;
      background: #1c1c1e; border: 1.5px solid #3a3a3c; border-radius: 12px;
      color: #fff; font-family: 'Menlo', 'Monaco', monospace; font-size: 12px;
      padding: 12px; resize: vertical; line-height: 1.4;
    }
    #cfg-ta:focus { outline: none; border-color: #0a84ff; }

    #cfg-err { color: #ff453a; font-size: 13px; display: none; max-width: 480px; }

    .primary-btn {
      background: #0a84ff; color: #fff; border: none; border-radius: 12px;
      padding: 14px 0; font-size: 17px; font-weight: 600; cursor: pointer;
      width: 100%; max-width: 480px;
    }
    .primary-btn:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
    .primary-btn:active { opacity: 0.8; }

    /* ── App ─────────────────────────────────────────────── */
    #app { display: none; flex-direction: column; min-height: 100dvh; }

    /* Header */
    #hdr {
      position: sticky; top: 0; z-index: 10;
      background: rgba(0,0,0,0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid #3a3a3c;
      padding: 12px 16px 0;
    }
    #hdr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #hdr-title { font-size: 20px; font-weight: 700; }
    #hdr-right { display: flex; align-items: center; gap: 10px; }
    #cfg-link {
      background: none; border: none; color: #8e8e93; cursor: pointer;
      padding: 6px; border-radius: 8px; display: flex; align-items: center;
    }
    #cfg-link svg { width: 18px; height: 18px; fill: currentColor; }
    #cfg-link:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }

    #refresh-wrap {
      position: fixed; bottom: 24px; right: 20px; z-index: 100;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #refresh-cd { font-size: 11px; color: #8e8e93; min-width: 28px; text-align: center; }

    #refresh-fab {
      width: 54px; height: 54px; border-radius: 50%;
      background: #0a84ff; border: none; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #refresh-fab svg { width: 22px; height: 22px; fill: currentColor; }
    #refresh-fab:focus-visible { outline: 2px solid #0a84ff; outline-offset: 4px; }
    #refresh-fab:active { opacity: 0.85; transform: scale(0.95); transition: transform 0.1s; }


    /* Tabs */
    #tabs { display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    #tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: #8e8e93; cursor: pointer; font-size: 14px; font-weight: 500;
      padding: 8px 14px; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.on { color: #fff; border-bottom-color: #0a84ff; }
    .tab:focus-visible { outline: 2px solid #0a84ff; outline-offset: -2px; }

    /* Content */
    #content { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

    /* Cards */
    .stop-card {
      background: #1c1c1e; border-radius: 12px; padding: 14px 16px;
    }

    /* Collapsed: all routes at this stop have no service */
    .stop-card.no-service {
      padding: 11px 16px;
      display: flex; align-items: baseline; gap: 10px;
    }
    .stop-card.no-service .route-rows { display: none; }
    .no-svc-label {
      display: none; font-size: 13px; color: #636366;
    }
    .stop-card.no-service .no-svc-label { display: inline; }

    .stop-name {
      font-size: 17px; font-weight: 700; margin-bottom: 10px;
    }
    .stop-card.no-service .stop-name { margin-bottom: 0; }

    /* Route rows */
    .route-rows { display: flex; flex-direction: column; gap: 10px; }
    .route-row  { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    .route-lbl {
      font-size: 13px; font-weight: 500; color: #8e8e93;
      white-space: nowrap;
    }
    .dir-lbl {
      font-size: 11px; color: #48484a;
      text-transform: uppercase; letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .arrivals { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      background: #2c2c2e; border-radius: 8px;
      padding: 6px 11px; font-size: 17px; font-weight: 700; color: #fff;
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .chip.due  { background: rgba(255,214,10,0.15); color: #ffd60a; }
    .chip.soon { color: #30d158; }
    .chip.loop { background: rgba(10,132,255,0.15); color: #0a84ff; }
    .eta { font-size: 11px; font-weight: 400; color: #48484a; }

    .card-status { font-size: 14px; color: #636366; }
    .card-err    { font-size: 13px; color: #ff453a; }
    .no-arr      { font-size: 13px; color: #3a3a3c; }

    /* Debug block */
    details.debug-block { margin-top: 4px; }
    details.debug-block > summary {
      font-size: 13px; color: #8e8e93; cursor: pointer; padding: 6px 0;
      user-select: none; list-style: none;
    }
    details.debug-block > summary::-webkit-details-marker { display: none; }
    details.debug-block > summary:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: 2px; }
    details.debug-block pre {
      background: #0d0d0d; border: 0.5px solid #3a3a3c; border-radius: 8px;
      padding: 10px 12px; font-family: 'Menlo', 'Monaco', monospace; font-size: 12px;
      color: #aeaeb2; overflow-x: auto; margin-top: 4px;
      white-space: pre; max-height: 400px; overflow-y: auto;
    }

    /* CTA Stop */
    #stop-wrap { display: flex; flex-direction: column; gap: 12px; }
    #stop-row  { display: flex; gap: 8px; }

    #stop-inp {
      flex: 1; background: #1c1c1e; border: 1.5px solid #3a3a3c; border-radius: 10px;
      color: #fff; font-size: 17px; padding: 10px 14px;
    }
    #stop-inp:focus { outline: none; border-color: #0a84ff; }

    #stop-go {
      background: #0a84ff; border: none; border-radius: 10px;
      color: #fff; cursor: pointer; font-size: 17px; font-weight: 600;
      padding: 10px 18px;
    }
    #stop-go:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
    #stop-go:active { opacity: 0.8; }

    #stop-results { display: flex; flex-direction: column; gap: 10px; }

    #stop-saved { display: flex; flex-wrap: wrap; gap: 8px; }
    .stop-fav-wrap { display: inline-flex; align-items: center; background: #2c2c2e; border-radius: 20px; overflow: hidden; }
    .stop-fav { background: none; border: none; color: #fff; cursor: pointer; font-size: 13px; padding: 6px 12px; }
    .stop-fav:active { opacity: 0.7; }
    .stop-fav-rm { background: none; border: none; color: #636366; cursor: pointer; font-size: 14px; padding: 6px 10px 6px 2px; line-height: 1; }
    .stop-save-btn { background: none; border: none; color: #0a84ff; cursor: pointer; font-size: 13px; padding: 4px 0 8px; display: block; text-align: left; }

    #debug-sections > details { margin-top: 4px; }
    #debug-sections > details > summary {
      font-size: 12px; color: #8e8e93; cursor: pointer; padding: 4px 0;
      user-select: none; list-style: none;
    }
    #debug-sections > details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>

<!-- Config screen -->
<div id="cfg">
  <h1>Transit</h1>
  <p>Paste your config JSON to get started. It stays in this browser only — nothing leaves this device.</p>
  <p>More information can be found in <a href="https://github.com/vitorgomateus/uchi-transit">the project repo</a>.</p>
  <label for="cfg-ta" class="visually-hidden">Config JSON</label>
  <textarea id="cfg-ta" spellcheck="false"
    placeholder='{ "passio_system_id": 1068, "cta_api_key": "...", "tabs": [...] }'></textarea>
  <div id="cfg-err" role="alert"></div>
  <button class="primary-btn" onclick="applyConfig()">Load config</button>
</div>

<!-- App -->
<div id="app">
  <header id="hdr">
    <div id="hdr-top">
      <h1 id="hdr-title">Transit</h1>
      <div id="hdr-right">
        <button id="cfg-link" onclick="showCfgScreen()" aria-label="Open configuration" title="Open configuration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M195.1 9.5C198.1-5.3 211.2-16 226.4-16l59.8 0c15.2 0 28.3 10.7 31.3 25.5L332 79.5c14.1 6 27.3 13.7 39.3 22.8l67.8-22.5c14.4-4.8 30.2 1.2 37.8 14.4l29.9 51.8c7.6 13.2 4.9 29.8-6.5 39.9L447 233.3c.9 7.4 1.3 15 1.3 22.7s-.5 15.3-1.3 22.7l53.4 47.5c11.4 10.1 14 26.8 6.5 39.9l-29.9 51.8c-7.6 13.1-23.4 19.2-37.8 14.4l-67.8-22.5c-12.1 9.1-25.3 16.7-39.3 22.8l-14.4 69.9c-3.1 14.9-16.2 25.5-31.3 25.5l-59.8 0c-15.2 0-28.3-10.7-31.3-25.5l-14.4-69.9c-14.1-6-27.2-13.7-39.3-22.8L73.5 432.3c-14.4 4.8-30.2-1.2-37.8-14.4L5.8 366.1c-7.6-13.2-4.9-29.8 6.5-39.9l53.4-47.5c-.9-7.4-1.3-15-1.3-22.7s.5-15.3 1.3-22.7L12.3 185.8c-11.4-10.1-14-26.8-6.5-39.9L35.7 94.1c7.6-13.2 23.4-19.2 37.8-14.4l67.8 22.5c12.1-9.1 25.3-16.7 39.3-22.8L195.1 9.5zM256.3 336a80 80 0 1 0 -.6-160 80 80 0 1 0 .6 160z"/></svg>
        </button>
      </div>
    </div>
    <nav id="tabs" role="tablist" aria-label="Transit tabs"></nav>
  </header>
  <main id="content"></main>
  <div id="refresh-wrap">
    <span id="refresh-cd" aria-hidden="true"></span>
    <button id="refresh-fab" onclick="doRefresh()" aria-label="Refresh arrivals" title="Refresh arrivals">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 64c-56.8 0-107.9 24.7-143.1 64l47.1 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 192c-17.7 0-32-14.3-32-32L0 32C0 14.3 14.3 0 32 0S64 14.3 64 32l0 54.7C110.9 33.6 179.5 0 256 0 397.4 0 512 114.6 512 256S397.4 512 256 512c-87 0-163.9-43.4-210.1-109.7-10.1-14.5-6.6-34.4 7.9-44.6s34.4-6.6 44.6 7.9c34.8 49.8 92.4 82.3 157.6 82.3 106 0 192-86 192-192S362 64 256 64z"/></svg>
    </button>
  </div>
</div>

<script src="protobuf.min.js"></script>
<script>
// ── Protobuf: GTFS-RT (TripUpdates + VehiclePositions) ───────────────────────
const FeedMessage = protobuf.Root.fromJSON({
  nested: {
    transit_realtime: {
      nested: {
        FeedMessage: { fields: {
          header: { id:1, type:'FeedHeader', rule:'required' },
          entity: { id:2, type:'FeedEntity',  rule:'repeated' }
        }},
        FeedHeader: { fields: {
          gtfsRealtimeVersion: { id:1, type:'string', rule:'required' },
          timestamp:           { id:4, type:'uint64' }
        }},
        FeedEntity: { fields: {
          id:         { id:1, type:'string',          rule:'required' },
          tripUpdate: { id:3, type:'TripUpdate' },
          vehicle:    { id:4, type:'VehiclePosition' }
        }},
        TripUpdate: { fields: {
          trip:           { id:1, type:'TripDescriptor', rule:'required' },
          stopTimeUpdate: { id:2, type:'StopTimeUpdate', rule:'repeated' }
        }},
        VehiclePosition: { fields: {
          trip:     { id:1, type:'TripDescriptor' },
          vehicle:  { id:2, type:'VehicleDescriptor' },
          position: { id:3, type:'Position' }
        }},
        TripDescriptor: { fields: {
          tripId:  { id:1, type:'string' },
          routeId: { id:5, type:'string' }
        }},
        StopTimeUpdate: { fields: {
          stopSequence: { id:1, type:'uint32' },
          stopId:       { id:4, type:'string' },
          arrival:      { id:2, type:'StopTimeEvent' },
          departure:    { id:3, type:'StopTimeEvent' }
        }},
        StopTimeEvent: { fields: {
          delay:       { id:1, type:'int32' },
          time:        { id:2, type:'int64' },
          uncertainty: { id:3, type:'int32' }
        }},
        Position: { fields: {
          latitude:  { id:1, type:'float', rule:'required' },
          longitude: { id:2, type:'float', rule:'required' },
          bearing:   { id:3, type:'float' },
          speed:     { id:5, type:'float' }
        }},
        VehicleDescriptor: { fields: {
          id:    { id:1, type:'string' },
          label: { id:2, type:'string' }
        }}
      }
    }
  }
}).lookupType('transit_realtime.FeedMessage');

// ── State ─────────────────────────────────────────────────────────────────────
let cfg              = null;
let activeTab        = 0;
let cdTimer          = null;
let rfTimer          = null;
let lastPassio       = null;
let _pendingStopSave = null;

// ── Config management ─────────────────────────────────────────────────────────
function applyConfig() {
  const raw = document.getElementById('cfg-ta').value.trim();
  const err = document.getElementById('cfg-err');
  err.style.display = 'none';

  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) {
    err.textContent = 'JSON error: ' + e.message;
    err.style.display = 'block';
    return;
  }

  if (!Array.isArray(parsed.tabs)) {
    err.textContent = 'Config must have a "tabs" array.';
    err.style.display = 'block';
    return;
  }

  localStorage.setItem('transit_cfg', raw);
  cfg = parsed;
  startApp();
}

function showCfgScreen() {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('cfg').style.display  = 'flex';
  const saved = localStorage.getItem('transit_cfg');
  if (saved) document.getElementById('cfg-ta').value = saved;
}

function startApp() {
  document.getElementById('cfg').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // Migrate renamed localStorage keys (one-time)
  if (!localStorage.getItem('transit_stop') && localStorage.getItem('transit_spot'))
    localStorage.setItem('transit_stop', localStorage.getItem('transit_spot'));
  localStorage.removeItem('transit_spot');
  if (!localStorage.getItem('transit_stops') && localStorage.getItem('transit_spots'))
    localStorage.setItem('transit_stops', localStorage.getItem('transit_spots'));
  localStorage.removeItem('transit_spots');
  syncStopFavorites();
  buildTabs();
  let initTab = 0;
  try {
    const s = JSON.parse(localStorage.getItem('transit_tab') || 'null');
    if (s && Date.now() - s.t < 30 * 60 * 1000 && s.i < cfg.tabs.length) initTab = s.i;
  } catch {}
  switchTab(initTab);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tabs');
  bar.innerHTML = '';
  cfg.tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.setAttribute('aria-controls', 'content');
    b.setAttribute('tabindex', '-1');
    b.textContent = t.label;
    b.onclick = () => switchTab(i);
    bar.appendChild(b);
  });
  bar.addEventListener('keydown', handleTabKeydown);
}

function handleTabKeydown(e) {
  const tabs = [...document.querySelectorAll('#tabs .tab')];
  const cur  = tabs.indexOf(document.activeElement);
  if (cur === -1) return;
  let next = cur;
  if      (e.key === 'ArrowRight') next = (cur + 1) % tabs.length;
  else if (e.key === 'ArrowLeft')  next = (cur - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home')       next = 0;
  else if (e.key === 'End')        next = tabs.length - 1;
  else return;
  e.preventDefault();
  switchTab(next);
  tabs[next].focus();
}

function switchTab(i) {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('refresh-cd').textContent = '';
  activeTab = i;
  localStorage.setItem('transit_tab', JSON.stringify({ i, t: Date.now() }));
  document.querySelectorAll('.tab').forEach((b, j) => {
    b.classList.toggle('on', j === i);
    b.setAttribute('aria-selected', j === i ? 'true' : 'false');
    b.setAttribute('tabindex', j === i ? '0' : '-1');
  });
  renderContent();
  doRefresh();
}

// ── Content rendering ─────────────────────────────────────────────────────────
function renderContent() {
  const el  = document.getElementById('content');
  const tab = cfg.tabs[activeTab];
  if (!tab) return;

  if (tab.type === 'cta-alerts') {
    el.innerHTML = '<div id="alerts-wrap" aria-live="polite"><p class="card-status">Loading…</p></div>';
    return;
  }

  if (tab.type === 'cta-spot' || tab.type === 'cta-stop') {
    const last = localStorage.getItem('transit_stop') || '';
    el.innerHTML = `
      <div id="stop-wrap">
        <div id="stop-row">
          <label for="stop-inp" class="visually-hidden">CTA stop number</label>
          <input id="stop-inp" type="text" inputmode="numeric"
            placeholder="CTA stop number" value="${last}"
            onkeydown="if(event.key==='Enter')doStop()">
          <button id="stop-go" onclick="doStop()">Go</button>
        </div>
        <div id="stop-saved" aria-label="Saved stops"></div>
        <div id="stop-results" aria-live="polite"></div>
      </div>`;
    renderSavedStops();
    return;
  }

  const stops = tab.stops || [];
  if (!stops.length) {
    el.innerHTML = '<p class="card-status" style="text-align:center;padding:32px 0">No stops configured.</p>';
    return;
  }

  el.innerHTML = '';
  let feedIdx = 0;

  for (const stop of stops) {
    const card = document.createElement('div');
    card.className = 'stop-card';
    card.dataset.gid = stop.label;

    let html = `<div class="stop-name">${stop.label}</div>`;
    html += '<span class="no-svc-label">No service scheduled</span>';
    html += '<div class="route-rows">';

    for (const feed of (stop.feeds || [])) {
      const routeLbl = feed.source === 'passio' ? (feed.route_label || 'Shuttle') : `Route ${feed.route}`;
      const rowDesc  = routeLbl + (feed.direction ? ', ' + feed.direction : '');
      html += '<div class="route-row">';
      if (routeLbl)       html += `<span class="route-lbl">${routeLbl}</span>`;
      if (feed.direction) html += `<span class="dir-lbl">${feed.direction}</span>`;
      html += `<div class="arrivals" id="row-${feedIdx}" data-idx="${feedIdx}" data-lbl="${rowDesc}" aria-live="polite" aria-label="${rowDesc}: loading"><span class="card-status" aria-hidden="true">…</span></div>`;
      html += '</div>';
      feedIdx++;
    }

    html += '</div>';
    card.innerHTML = html;
    el.appendChild(card);
  }

  // Collapsible raw feed debug block
  const dbk = document.createElement('details');
  dbk.className = 'debug-block';
  dbk.id = 'debug-block';
  dbk.innerHTML = '<summary>Debug</summary><div id="debug-sections"><p style="font-size:12px;color:#8e8e93;padding:4px 0">(waiting for refresh)</p></div>';
  el.appendChild(dbk);
}

// ── Row updaters ──────────────────────────────────────────────────────────────
// arrivals: [{m, approx}] — approx is position-based estimate or null
function setRowArrivals(i, arrivals) {
  const el = document.getElementById(`row-${i}`);
  if (!el) return;
  el.dataset.resolved = '1';
  el.dataset.hasService = arrivals.length ? '1' : '0';

  const prefix = el.dataset.lbl ? el.dataset.lbl + ': ' : '';

  if (!arrivals.length) {
    el.setAttribute('aria-label', prefix + 'no service');
    el.innerHTML = '<span class="no-arr" aria-hidden="true">—</span>';
    maybeCollapseGroup(el);
    return;
  }

  const summary = arrivals.map(({ m }) => m <= 0 ? 'Due' : `${m} min`).join(', ');
  el.setAttribute('aria-label', prefix + summary);

  el.innerHTML = arrivals.map(({ m, approx, loop }) => {
    if (m <= 0) return '<span class="chip due" aria-hidden="true">Due</span>';
    const cls = (m <= 5 ? 'chip soon' : 'chip') + (loop ? ' loop' : '');
    const etaHtml = approx != null ? `<span class="eta" aria-hidden="true">[${approx}]</span>` : '';
    return `<span class="${cls}" aria-hidden="true">${m}${etaHtml}</span>`;
  }).join('');

  maybeCollapseGroup(el);
}

function maybeCollapseGroup(rowEl) {
  const card = rowEl.closest('.stop-card');
  if (!card) return;
  const rows = card.querySelectorAll('.arrivals[data-idx]');
  const allResolved = [...rows].every(r => r.dataset.resolved === '1');
  if (!allResolved) return;
  const allEmpty = [...rows].every(r => r.dataset.hasService === '0');
  card.classList.toggle('no-service', allEmpty);
}

function setRowErr(i, msg) {
  const el = document.getElementById(`row-${i}`);
  if (!el) return;
  el.dataset.resolved = '1';
  el.dataset.hasService = '1'; // error = don't collapse
  const prefix = el.dataset.lbl ? el.dataset.lbl + ': ' : '';
  el.setAttribute('aria-label', prefix + 'error — ' + msg);
  el.innerHTML = `<span class="card-err">${msg}</span>`;
  maybeCollapseGroup(el);
}

// ── Passio GTFS-RT ────────────────────────────────────────────────────────────
async function fetchPassioFeed() {
  const res = await fetch('https://passio3.com/chicago/passioTransit/gtfs/realtime/tripUpdates');
  if (!res.ok) throw new Error('Passio HTTP ' + res.status);
  return FeedMessage.decode(new Uint8Array(await res.arrayBuffer()));
}

async function fetchPassioVehicles() {
  const res = await fetch('https://passio3.com/chicago/passioTransit/gtfs/realtime/vehiclePositions');
  if (!res.ok) throw new Error('Vehicles HTTP ' + res.status);
  const ct = res.headers.get('Content-Type') || '';
  if (ct.includes('text') || ct.includes('json') || ct.includes('html')) {
    const body = await res.text();
    throw new Error(`Vehicles: unexpected content type "${ct}" — ${body.slice(0, 300)}`);
  }
  const buf = new Uint8Array(await res.arrayBuffer());
  try {
    return FeedMessage.decode(buf);
  } catch (e) {
    throw new Error(`Vehicles protobuf decode failed (${buf.length} bytes, Content-Type: "${ct}"): ${e.message}`);
  }
}

function longToSecs(val) {
  if (!val) return null;
  if (typeof val === 'object' && typeof val.toNumber === 'function') return val.toNumber();
  return Number(val);
}

// Returns [{m, tripId}] sorted ascending, capped at max
function getPassioArrivals(feed, routeId, stopId, max = 3) {
  const now     = Math.floor(Date.now() / 1000);
  const results = [];
  const rid     = String(routeId);
  const sid     = String(stopId);

  for (const ent of (feed.entity || [])) {
    if (!ent.tripUpdate) continue;
    const feedRouteId = ent.tripUpdate.trip?.routeId;
    if (feedRouteId && feedRouteId !== rid) continue;

    for (const stu of (ent.tripUpdate.stopTimeUpdate || [])) {
      if (stu.stopId !== sid) continue;
      const t = longToSecs(stu.arrival?.time) ?? longToSecs(stu.departure?.time);
      if (t && t > now - 60) {
        results.push({ m: Math.round((t - now) / 60), tripId: ent.tripUpdate.trip?.tripId || ent.id });
      }
    }
  }

  return results.sort((a, b) => a.m - b.m).slice(0, max);
}

// ── Vehicle-position ETA ──────────────────────────────────────────────────────
// Enabled per entry when stop_lat + stop_lon are in config.
// Haversine ÷ 18.5 km/h effective speed (15 mph avg, ×1.3 road factor).
function haversineKm(lat1, lon1, lat2, lon2) {
  const R    = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a    = Math.sin(dLat/2)**2
    + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getVehiclePos(vehiclesFeed, tripId, routeId, stopLat, stopLon) {
  if (!vehiclesFeed) return null;
  // Exact tripId match
  for (const ent of (vehiclesFeed.entity || [])) {
    const vp = ent.vehicle;
    if (tripId && vp?.trip?.tripId === tripId && vp.position) {
      return { lat: vp.position.latitude, lon: vp.position.longitude };
    }
  }
  // Fallback: nearest vehicle on same route (handles feeds where tripId is absent)
  if (!routeId || stopLat == null || stopLon == null) return null;
  let best = null, bestKm = Infinity;
  for (const ent of (vehiclesFeed.entity || [])) {
    const vp = ent.vehicle;
    if (String(vp?.trip?.routeId) !== String(routeId) || !vp.position) continue;
    const km = haversineKm(vp.position.latitude, vp.position.longitude, stopLat, stopLon);
    if (km < bestKm) { bestKm = km; best = { lat: vp.position.latitude, lon: vp.position.longitude }; }
  }
  return best;
}

// Returns [{m, approx}] — approx is null when no position data available
function addApproxEtas(arrivals, vehiclesFeed, stop, routeId) {
  const hasCoords = stop.lat != null && stop.lon != null;
  return arrivals.map(a => {
    if (!hasCoords || a.m > 12) return { m: a.m, approx: null, loop: a.loop };
    const pos = getVehiclePos(vehiclesFeed, a.tripId, routeId, stop.lat, stop.lon);
    if (!pos) return { m: a.m, approx: null, loop: a.loop };
    const km = haversineKm(pos.lat, pos.lon, stop.lat, stop.lon);
    return { m: a.m, approx: Math.round(km / 18.5 * 60), loop: a.loop };
  });
}

// ── Debug block ───────────────────────────────────────────────────────────────
function appendDebug(label, data) {
  const sec = document.getElementById('debug-sections');
  if (!sec) return;
  if (sec.querySelector('p')) sec.innerHTML = ''; // clear placeholder
  const isErr = data instanceof Error;
  const count = Array.isArray(data) ? ` — ${data.length}` : isErr ? ' — error' : '';
  const d = document.createElement('details');
  d.innerHTML = `<summary>${label}${count}</summary><pre>${JSON.stringify(isErr ? { error: data.message } : data, null, 2)}</pre>`;
  sec.appendChild(d);
}

function buildPassioDebug(feed, tab) {
  if (!feed) return null;
  const now      = Math.floor(Date.now() / 1000);
  const allFeeds = (tab.stops || []).flatMap(s => s.feeds || []);
  const routeIds = new Set(allFeeds.filter(f => f.source === 'passio').map(f => String(f.route)));
  const entities = (feed.entity || []).filter(ent => {
    const rid = ent.tripUpdate?.trip?.routeId;
    return !rid || routeIds.has(rid);
  });
  return {
    feed_timestamp:  longToSecs(feed.header?.timestamp),
    fetched_at:      new Date().toISOString(),
    matching_trips:  entities.length,
    trips: entities.map(ent => ({
      trip_id:  ent.tripUpdate?.trip?.tripId,
      route_id: ent.tripUpdate?.trip?.routeId,
      stops: (ent.tripUpdate?.stopTimeUpdate || []).map(stu => ({
        stop_id:  stu.stopId,
        stop_seq: stu.stopSequence,
        arr_min:  stu.arrival?.time   ? Math.round((longToSecs(stu.arrival.time)   - now) / 60) : null,
        dep_min:  stu.departure?.time ? Math.round((longToSecs(stu.departure.time) - now) / 60) : null,
      }))
    }))
  };
}

function buildVehicleDebug(feed) {
  if (!feed) return null;
  const vehicles = (feed.entity || []).map(ent => ({
    trip_id:  ent.vehicle?.trip?.tripId,
    route_id: ent.vehicle?.trip?.routeId,
    lat:      ent.vehicle?.position?.latitude,
    lon:      ent.vehicle?.position?.longitude,
    bearing:  ent.vehicle?.position?.bearing,
  }));
  return {
    fetched_at:     new Date().toISOString(),
    total_entities: vehicles.length,
    with_position:  vehicles.filter(v => v.lat != null).length,
    vehicles,
  };
}

// ── CTA Stop saved stops ──────────────────────────────────────────────────────
function getSavedStops() {
  try { return JSON.parse(localStorage.getItem('transit_stops') || '[]'); }
  catch { return []; }
}

function syncStopFavorites() {
  const tab  = cfg?.tabs?.find(t => t.type === 'cta-spot' || t.type === 'cta-stop');
  const favs = tab?.stop_favorites ?? tab?.spot_favorites;
  if (!favs?.length) return;
  const existing   = getSavedStops();
  const existingIds = new Set(existing.map(s => s.id));
  const merged = [
    ...favs.filter(s => s.id && !existingIds.has(s.id)),
    ...existing,
  ].slice(0, 6);
  localStorage.setItem('transit_stops', JSON.stringify(merged));
}

function saveStop(id, label) {
  const stops = getSavedStops().filter(s => s.id !== id);
  stops.unshift({ id, label });
  localStorage.setItem('transit_stops', JSON.stringify(stops.slice(0, 6)));
  renderSavedStops();
  document.querySelector('.stop-save-btn')?.remove();
}

function commitStopSave() {
  if (_pendingStopSave) saveStop(_pendingStopSave.id, _pendingStopSave.label);
  _pendingStopSave = null;
}

function removeStop(id) {
  const stops = getSavedStops().filter(s => s.id !== id);
  localStorage.setItem('transit_stops', JSON.stringify(stops));
  renderSavedStops();
}

function renderSavedStops() {
  const wrap = document.getElementById('stop-saved');
  if (!wrap) return;
  const stops = getSavedStops();
  wrap.innerHTML = stops.map(s =>
    `<span class="stop-fav-wrap">` +
    `<button class="stop-fav" onclick="loadStop('${s.id}')">${s.label}</button>` +
    `<button class="stop-fav-rm" onclick="removeStop('${s.id}')" aria-label="Remove ${s.label}">×</button>` +
    `</span>`
  ).join('');
}

function loadStop(id) {
  const inp = document.getElementById('stop-inp');
  if (inp) { inp.value = id; doStop(); }
}

// ── CTA via CORS proxy ────────────────────────────────────────────────────────
const CTA_BASE   = 'https://www.ctabustracker.com/bustime/api/v2/getpredictions';
const ctaProxy   = () => (cfg?.cta_proxy_url ?? 'https://api.allorigins.win/raw') + '?url=';
// API messages meaning "no vehicles right now" — collapse the card, not a red error
const CTA_NO_SVC = new Set(['No service scheduled', 'No arrival times', 'No actual times']);

async function fetchCTABatch(stopIds, routes) {
  if (!cfg.cta_api_key || cfg.cta_api_key === 'YOUR_KEY_HERE') {
    throw new Error('No CTA API key — add one to your config');
  }

  const stops  = Array.isArray(stopIds) ? stopIds : [stopIds];
  const params = new URLSearchParams({ key: cfg.cta_api_key, stpid: stops.join(','), top: '50', format: 'json' });
  if (routes.length) params.set('rt', routes.join(','));

  const res = await fetch(ctaProxy() + encodeURIComponent(`${CTA_BASE}?${params}`));
  if (!res.ok) throw new Error('CTA proxy HTTP ' + res.status);

  const data  = await res.json();
  const btr   = data?.['bustime-response'];
  const preds = btr?.prd || [];
  const errs  = btr?.error;
  if (!preds.length && errs?.length) {
    const msg = errs[0]?.msg || 'CTA error';
    if (CTA_NO_SVC.has(msg)) return [];
    throw new Error(msg);
  }

  return preds;
}

async function fetchCTARaw(stopId) {
  if (!cfg.cta_api_key || cfg.cta_api_key === 'YOUR_KEY_HERE') {
    throw new Error('No CTA API key — add one to your config');
  }

  const params = new URLSearchParams({ key: cfg.cta_api_key, stpid: String(stopId), top: '10', format: 'json' });
  const res    = await fetch(ctaProxy() + encodeURIComponent(`${CTA_BASE}?${params}`));
  if (!res.ok) throw new Error('CTA proxy HTTP ' + res.status);

  const data  = await res.json();
  const btr   = data?.['bustime-response'];
  const preds = btr?.prd || [];
  const errs  = btr?.error;
  if (!preds.length && errs?.length) throw new Error(errs[0]?.msg || 'CTA error');
  return preds;
}

async function fetchCTAAlerts(routes) {
  if (!cfg.cta_api_key || cfg.cta_api_key === 'YOUR_KEY_HERE') {
    throw new Error('No CTA API key — add one to your config');
  }
  const CTA_ALERTS = 'https://www.ctabustracker.com/bustime/api/v2/getservicebulletins';
  const params = new URLSearchParams({ key: cfg.cta_api_key, format: 'json' });
  if (routes?.length) params.set('rt', routes.join(','));
  const res = await fetch(ctaProxy() + encodeURIComponent(`${CTA_ALERTS}?${params}`));
  if (!res.ok) throw new Error('CTA alerts HTTP ' + res.status);
  const data = await res.json();
  const btr  = data?.['bustime-response'];
  if (btr?.error?.length && !btr?.sb?.length) throw new Error(btr.error[0]?.msg || 'CTA error');
  return btr?.sb || [];
}

async function doAlerts(tab) {
  const wrap = document.getElementById('alerts-wrap');
  if (!wrap) return;
  try {
    const bulletins = await fetchCTAAlerts(tab.routes || []);
    if (!bulletins.length) {
      wrap.innerHTML = '<p class="card-status" style="text-align:center;padding:32px 0">No active service alerts.</p>';
      return;
    }
    wrap.innerHTML = bulletins.map(sb => {
      const subject = (sb.sbj || sb.nm || 'Service Alert').replace(/</g, '&lt;');
      const detail  = (sb.dtl || sb.brf || '').replace(/</g, '&lt;');
      const routes  = (sb.srvc || []).map(s => s.rt?.rtnm || s.rt?.rtid).filter(Boolean).join(', ');
      return `<div class="stop-card">
        <div class="stop-name">${subject}</div>
        ${routes ? `<p class="route-lbl" style="margin-bottom:8px">Routes: ${routes.replace(/</g,'&lt;')}</p>` : ''}
        ${detail  ? `<p style="font-size:14px;line-height:1.5;color:#aeaeb2">${detail}</p>` : ''}
      </div>`;
    }).join('');
  } catch (e) {
    wrap.innerHTML = `<p class="card-err">${e.message.replace(/</g, '&lt;')}</p>`;
  }
}

// ── Refresh logic ─────────────────────────────────────────────────────────────
async function doRefresh() {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('refresh-cd').textContent = '';

  const tab = cfg?.tabs[activeTab];
  if (!tab) return;

  if (tab.type === 'cta-alerts') {
    await doAlerts(tab);
    scheduleNext();
    return;
  }

  if (tab.type === 'cta-spot' || tab.type === 'cta-stop') {
    const inp = document.getElementById('stop-inp');
    if (inp?.value.trim()) doStop();
    scheduleNext();
    return;
  }

  const stops = tab.stops || [];
  if (!stops.length) { scheduleNext(); return; }

  // Flatten stops → feeds, assigning sequential row indices matching renderContent
  const allFeeds = [];
  let idx = 0;
  for (const stop of stops) {
    for (const feed of (stop.feeds || [])) {
      allFeeds.push({ stop, feed, idx: idx++ });
    }
  }

  const hasPassio     = allFeeds.some(f => f.feed.source === 'passio');
  const needsVehicles = hasPassio && stops.some(s => s.lat != null);
  let passioFeed = null, passioErr = null, vehiclesFeed = null, vehiclesErr = null;

  // One CTA request for all CTA feeds in the tab
  const ctaItems      = allFeeds.filter(f => f.feed.source === 'cta');
  const ctaStopIds    = [...new Set(ctaItems.map(i => i.feed.stop_id))];
  const ctaRoutes     = [...new Set(ctaItems.map(i => i.feed.route))];
  const passioItems   = allFeeds.filter(f => f.feed.source === 'passio');
  const passioRoutes  = [...new Set(passioItems.map(i => i.feed.route))];
  const passioStopIds = [...new Set(passioItems.flatMap(i => [i.feed.stop_id, i.feed.loop_last_stop].filter(Boolean)))];
  let ctaAllPreds  = [];
  let ctaFetchErr  = null;

  const promises = [];

  const dbSec = document.getElementById('debug-sections');
  if (dbSec) dbSec.innerHTML = '<p style="font-size:12px;color:#8e8e93;padding:4px 0">Refreshing…</p>';

  if (hasPassio) {
    promises.push(
      Promise.all([
        fetchPassioFeed().catch(e => { passioErr = e.message; return null; }),
        needsVehicles ? fetchPassioVehicles().catch(e => { vehiclesErr = e; return null; }) : Promise.resolve(null),
      ]).then(([pf, vf]) => {
        passioFeed = pf; vehiclesFeed = vf; lastPassio = pf;
        appendDebug(`Passio TripUpdates (route ${passioRoutes.join(', ')}) — stops ${passioStopIds.join(', ')}`, passioErr ? new Error(passioErr) : buildPassioDebug(pf, tab));
        if (needsVehicles) appendDebug(`Passio VehiclePositions (route ${passioRoutes.join(', ')})`, vehiclesErr ?? buildVehicleDebug(vf));
      })
    );
  }

  if (ctaItems.length) {
    promises.push(
      fetchCTABatch(ctaStopIds, ctaRoutes)
        .then(preds => { ctaAllPreds = preds; appendDebug(`CTA (${ctaRoutes.join(', ')}) — stops ${ctaStopIds.join(', ')}`, preds); })
        .catch(e    => { ctaFetchErr = e;     appendDebug(`CTA (${ctaRoutes.join(', ')}) — stops ${ctaStopIds.join(', ')}`, e); })
    );
  }

  await Promise.all(promises);

  // Populate rows
  for (const { stop, feed, idx } of allFeeds) {
    try {
      if (feed.source === 'passio') {
        if (passioErr) throw new Error(passioErr);
        const arrivals = feed.loop_last_stop
          ? getPassioArrivals(passioFeed, feed.route, feed.loop_last_stop)
              .map(a => ({ ...a, m: a.m + (feed.loop_offset_min || 0), loop: true }))
          : getPassioArrivals(passioFeed, feed.route, feed.stop_id);
        setRowArrivals(idx, vehiclesFeed ? addApproxEtas(arrivals, vehiclesFeed, stop, feed.route)
                                         : arrivals.map(a => ({ m: a.m, approx: null, loop: a.loop })));
      } else if (feed.source === 'cta') {
        if (ctaFetchErr) throw ctaFetchErr;
        const mins = ctaAllPreds
          .filter(p => String(p.stpid) === String(feed.stop_id) && p.rt === feed.route)
          .map(p => p.prdctdn === 'DUE' ? 0 : parseInt(p.prdctdn, 10))
          .filter(m => !isNaN(m))
          .slice(0, 3);
        setRowArrivals(idx, mins.map(m => ({ m, approx: null })));
      }
    } catch (e) {
      setRowErr(idx, e.message);
    }
  }

  scheduleNext();
}

function scheduleNext() {
  let secs = 30;
  const cdEl = document.getElementById('refresh-cd');
  const localTimer = setInterval(() => {
    cdEl.textContent = (--secs) + 's';
    if (secs <= 0) clearInterval(localTimer);
  }, 1000);
  cdTimer = localTimer;
  rfTimer = setTimeout(doRefresh, 30_000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(rfTimer);
    clearInterval(cdTimer);
  } else {
    doRefresh();
  }
});

// ── CTA Stop check ────────────────────────────────────────────────────────────
async function doStop() {
  const inp = document.getElementById('stop-inp').value.trim();
  const res = document.getElementById('stop-results');
  if (!inp) return;

  localStorage.setItem('transit_stop', inp);
  res.innerHTML = '<p class="card-status">Loading…</p>';

  try {
    const preds = await fetchCTARaw(inp);
    if (!preds.length) {
      res.innerHTML = '<p class="card-status">No arrivals found for this stop.</p>';
      return;
    }

    const stopName     = preds[0]?.stpnm || `Stop ${inp}`;
    const safeStopName = stopName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    const saved        = getSavedStops();
    const isSaved      = saved.some(s => s.id === inp);
    const atCap        = saved.length >= 6;
    _pendingStopSave = isSaved || atCap ? null : { id: inp, label: stopName };
    const saveHtml = isSaved  ? ''
      : atCap ? '<p class="card-status" style="font-size:13px;padding:0 0 8px">Favorites full (6) — remove one to add more.</p>'
      : `<button class="stop-save-btn" onclick="commitStopSave()">☆ Save "${safeStopName}"</button>`;

    const byRoute = {};
    for (const p of preds) {
      if (!byRoute[p.rt]) byRoute[p.rt] = { rt: p.rt, des: p.des, dir: p.rtdir, arrivals: [] };
      const m = p.prdctdn === 'DUE' ? 0 : parseInt(p.prdctdn, 10);
      if (!isNaN(m)) byRoute[p.rt].arrivals.push({ m, vid: p.vid || null });
    }

    res.innerHTML = saveHtml + Object.values(byRoute).map(r => {
      const chips = r.arrivals.slice(0, 3).map(({ m }) => {
        if (m <= 0) return '<span class="chip due" aria-hidden="true">Due</span>';
        if (m <= 5) return `<span class="chip soon" aria-hidden="true">${m}</span>`;
        return `<span class="chip" aria-hidden="true">${m}</span>`;
      }).join('');
      return `<div class="stop-card">
        <div class="stop-name">Route ${r.rt} — ${r.des}</div>
        <div class="route-rows"><div class="route-row">
          <span class="dir-lbl">${r.dir}</span>
          <div class="arrivals">${chips}</div>
        </div></div>
      </div>`;
    }).join('');
  } catch (e) {
    res.innerHTML = `<p class="card-err">${e.message}</p>`;
  }
}

    cfg = JSON.parse(saved);
    startApp();
