<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Transit</title>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7/dist/protobuf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── Config screen ───────────────────────────────────── */
    #cfg {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; gap: 16px;
    }
    #cfg h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #cfg p  { color: #8e8e93; font-size: 15px; text-align: center; line-height: 1.5; max-width: 360px; }

    #cfg-ta {
      width: 100%; max-width: 480px; height: 200px;
      background: #1c1c1e; border: 1.5px solid #3a3a3c; border-radius: 12px;
      color: #fff; font-family: 'Menlo', 'Monaco', monospace; font-size: 12px;
      padding: 12px; resize: vertical; line-height: 1.4;
    }
    #cfg-ta:focus { outline: none; border-color: #0a84ff; }

    #cfg-err { color: #ff453a; font-size: 13px; display: none; max-width: 480px; }

    .primary-btn {
      background: #0a84ff; color: #fff; border: none; border-radius: 12px;
      padding: 14px 0; font-size: 17px; font-weight: 600; cursor: pointer;
      width: 100%; max-width: 480px;
    }
    .primary-btn:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
    .primary-btn:active { opacity: 0.8; }

    /* ── App ─────────────────────────────────────────────── */
    #app { display: none; flex-direction: column; min-height: 100dvh; }

    /* Header */
    #hdr {
      position: sticky; top: 0; z-index: 10;
      background: rgba(0,0,0,0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid #3a3a3c;
      padding: 12px 16px 0;
    }
    #hdr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #hdr-title { font-size: 20px; font-weight: 700; }
    #hdr-right { display: flex; align-items: center; gap: 10px; }
    #refresh-cd { font-size: 13px; color: #636366; min-width: 28px; text-align: right; }

    #refresh-btn {
      background: none; border: none; color: #0a84ff; cursor: pointer;
      font-size: 15px; font-weight: 500; padding: 4px 6px; border-radius: 4px;
    }
    #refresh-btn:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }

    #cfg-link {
      background: none; border: none; color: #636366; cursor: pointer;
      font-size: 13px; padding: 4px 0; border-radius: 4px;
    }
    #cfg-link:focus-visible { outline: 2px solid #636366; outline-offset: 2px; }

    /* Tabs */
    #tabs { display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    #tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: #8e8e93; cursor: pointer; font-size: 14px; font-weight: 500;
      padding: 8px 14px; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.on { color: #fff; border-bottom-color: #0a84ff; }
    .tab:focus-visible { outline: 2px solid #0a84ff; outline-offset: -2px; }

    /* Content */
    #content { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

    /* Cards */
    .stop-card {
      background: #1c1c1e; border-radius: 12px; padding: 14px 16px;
    }

    /* Collapsed: all routes at this stop have no service */
    .stop-card.no-service {
      padding: 11px 16px;
      display: flex; align-items: baseline; gap: 10px;
    }
    .stop-card.no-service .route-rows { display: none; }
    .no-svc-label {
      display: none; font-size: 13px; color: #636366;
    }
    .stop-card.no-service .no-svc-label { display: inline; }

    .stop-name {
      font-size: 17px; font-weight: 700; margin-bottom: 10px;
    }
    .stop-card.no-service .stop-name { margin-bottom: 0; }

    /* Route rows */
    .route-rows { display: flex; flex-direction: column; gap: 10px; }
    .route-row  { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

    .route-lbl {
      font-size: 13px; font-weight: 500; color: #8e8e93;
      white-space: nowrap;
    }
    .dir-lbl {
      font-size: 11px; color: #48484a;
      text-transform: uppercase; letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .arrivals { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      background: #2c2c2e; border-radius: 8px;
      padding: 6px 11px; font-size: 17px; font-weight: 700; color: #fff;
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .chip.due  { background: rgba(255,214,10,0.15); color: #ffd60a; }
    .chip.soon { color: #30d158; }
    .eta { font-size: 11px; font-weight: 400; color: #48484a; }

    .card-status { font-size: 14px; color: #636366; }
    .card-err    { font-size: 13px; color: #ff453a; }
    .no-arr      { font-size: 13px; color: #3a3a3c; }

    /* Debug block */
    details.debug-block { margin-top: 4px; }
    details.debug-block > summary {
      font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 6px 0;
      user-select: none; list-style: none;
    }
    details.debug-block > summary::-webkit-details-marker { display: none; }
    details.debug-block > summary:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: 2px; }
    details.debug-block pre {
      background: #0d0d0d; border: 0.5px solid #2c2c2e; border-radius: 8px;
      padding: 10px 12px; font-family: 'Menlo', 'Monaco', monospace; font-size: 10px;
      color: #636366; overflow-x: auto; margin-top: 4px;
      white-space: pre; max-height: 400px; overflow-y: auto;
    }

    /* CTA Spot */
    #spot-wrap { display: flex; flex-direction: column; gap: 12px; }
    #spot-row  { display: flex; gap: 8px; }

    #spot-inp {
      flex: 1; background: #1c1c1e; border: 1.5px solid #3a3a3c; border-radius: 10px;
      color: #fff; font-size: 17px; padding: 10px 14px;
    }
    #spot-inp:focus { outline: none; border-color: #0a84ff; }

    #spot-go {
      background: #0a84ff; border: none; border-radius: 10px;
      color: #fff; cursor: pointer; font-size: 17px; font-weight: 600;
      padding: 10px 18px;
    }
    #spot-go:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
    #spot-go:active { opacity: 0.8; }

    #spot-results { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

<!-- Config screen -->
<div id="cfg">
  <h1>Transit</h1>
  <p>Paste your config JSON to get started. It stays in this browser only — nothing leaves this device.</p>
  <label for="cfg-ta" class="visually-hidden">Config JSON</label>
  <textarea id="cfg-ta" spellcheck="false"
    placeholder='{ "passio_system_id": 1068, "cta_api_key": "...", "tabs": [...] }'></textarea>
  <div id="cfg-err" role="alert"></div>
  <button class="primary-btn" onclick="applyConfig()">Load config</button>
</div>

<!-- App -->
<div id="app">
  <header id="hdr">
    <div id="hdr-top">
      <span id="hdr-title">Transit</span>
      <div id="hdr-right">
        <span id="refresh-cd"></span>
        <button id="refresh-btn" onclick="doRefresh()" aria-label="Refresh now">↻ Refresh</button>
        <button id="cfg-link" onclick="showCfgScreen()">Config</button>
      </div>
    </div>
    <nav id="tabs" aria-label="Transit tabs"></nav>
  </header>
  <main id="content"></main>
</div>

<script>
// ── Protobuf: GTFS-RT (TripUpdates + VehiclePositions) ───────────────────────
const FeedMessage = protobuf.Root.fromJSON({
  nested: {
    transit_realtime: {
      nested: {
        FeedMessage: { fields: {
          header: { id:1, type:'FeedHeader', rule:'required' },
          entity: { id:2, type:'FeedEntity',  rule:'repeated' }
        }},
        FeedHeader: { fields: {
          gtfsRealtimeVersion: { id:1, type:'string', rule:'required' },
          timestamp:           { id:4, type:'uint64' }
        }},
        FeedEntity: { fields: {
          id:         { id:1, type:'string',          rule:'required' },
          tripUpdate: { id:3, type:'TripUpdate' },
          vehicle:    { id:4, type:'VehiclePosition' }
        }},
        TripUpdate: { fields: {
          trip:           { id:1, type:'TripDescriptor', rule:'required' },
          stopTimeUpdate: { id:2, type:'StopTimeUpdate', rule:'repeated' }
        }},
        VehiclePosition: { fields: {
          trip:     { id:1, type:'TripDescriptor' },
          vehicle:  { id:2, type:'VehicleDescriptor' },
          position: { id:3, type:'Position' }
        }},
        TripDescriptor: { fields: {
          tripId:  { id:1, type:'string' },
          routeId: { id:5, type:'string' }
        }},
        StopTimeUpdate: { fields: {
          stopSequence: { id:1, type:'uint32' },
          stopId:       { id:4, type:'string' },
          arrival:      { id:2, type:'StopTimeEvent' },
          departure:    { id:3, type:'StopTimeEvent' }
        }},
        StopTimeEvent: { fields: {
          delay:       { id:1, type:'int32' },
          time:        { id:2, type:'int64' },
          uncertainty: { id:3, type:'int32' }
        }},
        Position: { fields: {
          latitude:  { id:1, type:'float', rule:'required' },
          longitude: { id:2, type:'float', rule:'required' },
          bearing:   { id:3, type:'float' },
          speed:     { id:5, type:'float' }
        }},
        VehicleDescriptor: { fields: {
          id:    { id:1, type:'string' },
          label: { id:2, type:'string' }
        }}
      }
    }
  }
}).lookupType('transit_realtime.FeedMessage');

// ── State ─────────────────────────────────────────────────────────────────────
let cfg          = null;
let activeTab    = 0;
let cdTimer      = null;
let rfTimer      = null;
let lastPassio = null;

// ── Config management ─────────────────────────────────────────────────────────
function applyConfig() {
  const raw = document.getElementById('cfg-ta').value.trim();
  const err = document.getElementById('cfg-err');
  err.style.display = 'none';

  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) {
    err.textContent = 'JSON error: ' + e.message;
    err.style.display = 'block';
    return;
  }

  if (!Array.isArray(parsed.tabs)) {
    err.textContent = 'Config must have a "tabs" array.';
    err.style.display = 'block';
    return;
  }

  localStorage.setItem('transit_cfg', raw);
  cfg = parsed;
  startApp();
}

function showCfgScreen() {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('cfg').style.display  = 'flex';
  const saved = localStorage.getItem('transit_cfg');
  if (saved) document.getElementById('cfg-ta').value = saved;
}

function startApp() {
  document.getElementById('cfg').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  buildTabs();
  switchTab(0);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tabs');
  bar.innerHTML = '';
  cfg.tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.textContent = t.label;
    b.onclick = () => switchTab(i);
    bar.appendChild(b);
  });
}

function switchTab(i) {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('refresh-cd').textContent = '';
  activeTab = i;
  document.querySelectorAll('.tab').forEach((b, j) => {
    b.classList.toggle('on', j === i);
    b.setAttribute('aria-selected', j === i ? 'true' : 'false');
  });
  renderContent();
  doRefresh();
}

// ── Content rendering ─────────────────────────────────────────────────────────
function renderContent() {
  const el  = document.getElementById('content');
  const tab = cfg.tabs[activeTab];
  if (!tab) return;

  if (tab.type === 'cta-spot') {
    const last = localStorage.getItem('transit_spot') || '';
    el.innerHTML = `
      <div id="spot-wrap">
        <div id="spot-row">
          <label for="spot-inp" class="visually-hidden">CTA stop number</label>
          <input id="spot-inp" type="text" inputmode="numeric"
            placeholder="CTA stop number" value="${last}"
            onkeydown="if(event.key==='Enter')doSpot()">
          <button id="spot-go" onclick="doSpot()">Go</button>
        </div>
        <div id="spot-results" aria-live="polite"></div>
      </div>`;
    return;
  }

  const stops = tab.stops || [];
  if (!stops.length) {
    el.innerHTML = '<p class="card-status" style="text-align:center;padding:32px 0">No stops configured.</p>';
    return;
  }

  el.innerHTML = '';
  let feedIdx = 0;

  for (const stop of stops) {
    const card = document.createElement('div');
    card.className = 'stop-card';
    card.dataset.gid = stop.label;

    let html = `<div class="stop-name">${stop.label}</div>`;
    html += '<span class="no-svc-label">No service scheduled</span>';
    html += '<div class="route-rows">';

    for (const feed of (stop.feeds || [])) {
      const routeLbl = feed.source === 'passio' ? (feed.route_label || '') : `Route ${feed.route}`;
      html += '<div class="route-row">';
      if (routeLbl)     html += `<span class="route-lbl">${routeLbl}</span>`;
      if (feed.direction) html += `<span class="dir-lbl">${feed.direction}</span>`;
      html += `<div class="arrivals" id="row-${feedIdx}" data-idx="${feedIdx}"><span class="card-status">…</span></div>`;
      html += '</div>';
      feedIdx++;
    }

    html += '</div>';
    card.innerHTML = html;
    el.appendChild(card);
  }

  // Collapsible raw feed debug block
  const dbk = document.createElement('details');
  dbk.className = 'debug-block';
  dbk.id = 'debug-block';
  dbk.innerHTML = '<summary>Raw feed data</summary><pre id="debug-pre">(waiting for refresh)</pre>';
  el.appendChild(dbk);
}

// ── Row updaters ──────────────────────────────────────────────────────────────
// arrivals: [{m, approx}] — approx is position-based estimate or null
function setRowArrivals(i, arrivals) {
  const el = document.getElementById(`row-${i}`);
  if (!el) return;
  el.dataset.resolved = '1';
  el.dataset.hasService = arrivals.length ? '1' : '0';

  if (!arrivals.length) {
    el.innerHTML = '<span class="no-arr">—</span>';
    maybeCollapseGroup(el);
    return;
  }

  el.innerHTML = arrivals.map(({ m, approx }) => {
    if (m <= 0) return '<span class="chip due">Due</span>';
    const cls = m <= 5 ? 'chip soon' : 'chip';
    const etaHtml = approx != null ? `<span class="eta">[${approx}]</span>` : '';
    return `<span class="${cls}">${m}${etaHtml}</span>`;
  }).join('');

  maybeCollapseGroup(el);
}

function maybeCollapseGroup(rowEl) {
  const card = rowEl.closest('.stop-card');
  if (!card) return;
  const rows = card.querySelectorAll('.arrivals[data-idx]');
  const allResolved = [...rows].every(r => r.dataset.resolved === '1');
  if (!allResolved) return;
  const allEmpty = [...rows].every(r => r.dataset.hasService === '0');
  card.classList.toggle('no-service', allEmpty);
}

function setRowErr(i, msg) {
  const el = document.getElementById(`row-${i}`);
  if (!el) return;
  el.dataset.resolved = '1';
  el.dataset.hasService = '1'; // error = don't collapse
  el.innerHTML = `<span class="card-err">${msg}</span>`;
  maybeCollapseGroup(el);
}

// ── Passio GTFS-RT ────────────────────────────────────────────────────────────
async function fetchPassioFeed() {
  const res = await fetch('https://passio3.com/chicago/passioTransit/gtfs/realtime/tripUpdates');
  if (!res.ok) throw new Error('Passio HTTP ' + res.status);
  return FeedMessage.decode(new Uint8Array(await res.arrayBuffer()));
}

async function fetchPassioVehicles() {
  const res = await fetch('https://passio3.com/chicago/passioTransit/gtfs/realtime/vehiclePositions');
  if (!res.ok) throw new Error('Vehicles HTTP ' + res.status);
  return FeedMessage.decode(new Uint8Array(await res.arrayBuffer()));
}

function longToSecs(val) {
  if (!val) return null;
  if (typeof val === 'object' && typeof val.toNumber === 'function') return val.toNumber();
  return Number(val);
}

// Returns [{m, tripId}] sorted ascending, capped at max
function getPassioArrivals(feed, routeId, stopId, max = 3) {
  const now     = Math.floor(Date.now() / 1000);
  const results = [];
  const rid     = String(routeId);
  const sid     = String(stopId);

  for (const ent of (feed.entity || [])) {
    if (!ent.tripUpdate) continue;
    const feedRouteId = ent.tripUpdate.trip?.routeId;
    if (feedRouteId && feedRouteId !== rid) continue;

    for (const stu of (ent.tripUpdate.stopTimeUpdate || [])) {
      if (stu.stopId !== sid) continue;
      const t = longToSecs(stu.arrival?.time) ?? longToSecs(stu.departure?.time);
      if (t && t > now - 60) {
        results.push({ m: Math.round((t - now) / 60), tripId: ent.tripUpdate.trip?.tripId || ent.id });
      }
    }
  }

  return results.sort((a, b) => a.m - b.m).slice(0, max);
}

// ── Vehicle-position ETA ──────────────────────────────────────────────────────
// Enabled per entry when stop_lat + stop_lon are in config.
// Haversine ÷ 18.5 km/h effective speed (15 mph avg, ×1.3 road factor).
function haversineKm(lat1, lon1, lat2, lon2) {
  const R    = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a    = Math.sin(dLat/2)**2
    + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getVehiclePos(vehiclesFeed, tripId) {
  if (!vehiclesFeed || !tripId) return null;
  for (const ent of (vehiclesFeed.entity || [])) {
    const vp = ent.vehicle;
    if (vp?.trip?.tripId === tripId && vp.position) {
      return { lat: vp.position.latitude, lon: vp.position.longitude };
    }
  }
  return null;
}

// Returns [{m, approx}] — approx is null when no position data available
function addApproxEtas(arrivals, vehiclesFeed, stop) {
  const hasCoords = stop.lat != null && stop.lon != null;
  return arrivals.map(a => {
    if (!hasCoords || a.m > 12) return { m: a.m, approx: null };
    const pos = getVehiclePos(vehiclesFeed, a.tripId);
    if (!pos) return { m: a.m, approx: null };
    const km = haversineKm(pos.lat, pos.lon, stop.lat, stop.lon);
    return { m: a.m, approx: Math.round(km / 18.5 * 60) };
  });
}

// ── Debug block ───────────────────────────────────────────────────────────────
function updateDebug(tab, passioFeed) {
  const pre = document.getElementById('debug-pre');
  if (!pre) return;

  const now = Math.floor(Date.now() / 1000);
  const allFeeds = (tab.stops || []).flatMap(s => s.feeds || []);

  if (!passioFeed || !allFeeds.some(f => f.source === 'passio')) {
    pre.textContent = '(no Passio data for this tab)';
    return;
  }

  const routeIds = new Set(
    allFeeds.filter(f => f.source === 'passio').map(f => String(f.route_id))
  );
  const entities = (passioFeed.entity || []).filter(ent => {
    const rid = ent.tripUpdate?.trip?.routeId;
    return !rid || routeIds.has(rid);
  });

  pre.textContent = JSON.stringify({
    feed_ts:        longToSecs(passioFeed.header?.timestamp),
    fetched_at:     new Date().toISOString(),
    matching_trips: entities.length,
    trips: entities.map(ent => ({
      entity_id: ent.id,
      trip_id:   ent.tripUpdate?.trip?.tripId,
      route_id:  ent.tripUpdate?.trip?.routeId,
      stops: (ent.tripUpdate?.stopTimeUpdate || []).map(stu => ({
        stop_id:  stu.stopId,
        stop_seq: stu.stopSequence,
        arr_min:  stu.arrival?.time   ? Math.round((longToSecs(stu.arrival.time)   - now) / 60) : null,
        dep_min:  stu.departure?.time ? Math.round((longToSecs(stu.departure.time) - now) / 60) : null,
      }))
    }))
  }, null, 2);
}

// ── CTA via CORS proxy ────────────────────────────────────────────────────────
const CTA_BASE   = 'https://www.ctabustracker.com/bustime/api/v2/getpredictions';
const ctaProxy   = () => (cfg?.cta_proxy_url ?? 'https://api.allorigins.win/raw') + '?url=';
// API messages meaning "no vehicles right now" — collapse the card, not a red error
const CTA_NO_SVC = new Set(['No service scheduled', 'No arrival times', 'No actual times']);

async function fetchCTABatch(stopId, routes) {
  if (!cfg.cta_api_key || cfg.cta_api_key === 'YOUR_KEY_HERE') {
    throw new Error('No CTA API key — add one to your config');
  }

  const params = new URLSearchParams({ key: cfg.cta_api_key, stpid: String(stopId), format: 'json' });
  if (routes.length) params.set('rt', routes.join(','));

  const res = await fetch(ctaProxy() + encodeURIComponent(`${CTA_BASE}?${params}`));
  if (!res.ok) throw new Error('CTA proxy HTTP ' + res.status);

  const data  = await res.json();
  const btr   = data?.['bustime-response'];
  const preds = btr?.prd || [];
  const errs  = btr?.error;
  if (!preds.length && errs?.length) {
    const msg = errs[0]?.msg || 'CTA error';
    if (CTA_NO_SVC.has(msg)) return [];
    throw new Error(msg);
  }

  return preds;
}

async function fetchCTARaw(stopId) {
  if (!cfg.cta_api_key || cfg.cta_api_key === 'YOUR_KEY_HERE') {
    throw new Error('No CTA API key — add one to your config');
  }

  const params = new URLSearchParams({ key: cfg.cta_api_key, stpid: String(stopId), format: 'json' });
  const res    = await fetch(ctaProxy() + encodeURIComponent(`${CTA_BASE}?${params}`));
  if (!res.ok) throw new Error('CTA proxy HTTP ' + res.status);

  const data  = await res.json();
  const btr   = data?.['bustime-response'];
  const preds = btr?.prd || [];
  const errs  = btr?.error;
  if (!preds.length && errs?.length) throw new Error(errs[0]?.msg || 'CTA error');
  return preds;
}

// ── Refresh logic ─────────────────────────────────────────────────────────────
async function doRefresh() {
  clearTimeout(rfTimer);
  clearInterval(cdTimer);
  document.getElementById('refresh-cd').textContent = '';

  const tab = cfg?.tabs[activeTab];
  if (!tab) return;

  if (tab.type === 'cta-spot') { scheduleNext(); return; }

  const stops = tab.stops || [];
  if (!stops.length) { scheduleNext(); return; }

  // Flatten stops → feeds, assigning sequential row indices matching renderContent
  const allFeeds = [];
  let idx = 0;
  for (const stop of stops) {
    for (const feed of (stop.feeds || [])) {
      allFeeds.push({ stop, feed, idx: idx++ });
    }
  }

  const hasPassio     = allFeeds.some(f => f.feed.source === 'passio');
  const needsVehicles = hasPassio && stops.some(s => s.lat != null);
  let passioFeed = null, passioErr = null, vehiclesFeed = null;

  // Group CTA feeds by stop_id for batching (one request per physical stop)
  const ctaBatches = new Map(); // stop_id → [{feed, idx, stop}]
  for (const item of allFeeds) {
    if (item.feed.source !== 'cta') continue;
    const sid = item.feed.stop_id;
    if (!ctaBatches.has(sid)) ctaBatches.set(sid, []);
    ctaBatches.get(sid).push(item);
  }

  // Kick off all requests concurrently
  const ctaResults = new Map(); // stop_id → preds[] | Error

  const promises = [];

  if (hasPassio) {
    promises.push(
      Promise.all([
        fetchPassioFeed().catch(e => { passioErr = e.message; return null; }),
        needsVehicles ? fetchPassioVehicles().catch(() => null) : Promise.resolve(null),
      ]).then(([pf, vf]) => { passioFeed = pf; vehiclesFeed = vf; lastPassio = pf; })
    );
  }

  for (const [stopId, items] of ctaBatches) {
    const routes = items.map(i => i.feed.route);
    promises.push(
      fetchCTABatch(stopId, routes)
        .then(preds => ctaResults.set(stopId, preds))
        .catch(e    => ctaResults.set(stopId, e))
    );
  }

  await Promise.all(promises);

  // Populate rows
  for (const { stop, feed, idx } of allFeeds) {
    try {
      if (feed.source === 'passio') {
        if (passioErr) throw new Error(passioErr);
        const raw = getPassioArrivals(passioFeed, feed.route_id, feed.stop_id);
        setRowArrivals(idx, vehiclesFeed ? addApproxEtas(raw, vehiclesFeed, stop)
                                         : raw.map(a => ({ m: a.m, approx: null })));
      } else if (feed.source === 'cta') {
        const result = ctaResults.get(feed.stop_id);
        if (result instanceof Error) throw result;
        const preds = result || [];
        const mins = preds
          .filter(p => p.rt === feed.route)
          .map(p => p.prdctdn === 'DUE' ? 0 : parseInt(p.prdctdn, 10))
          .filter(m => !isNaN(m))
          .slice(0, 3);
        setRowArrivals(idx, mins.map(m => ({ m, approx: null })));
      }
    } catch (e) {
      setRowErr(idx, e.message);
    }
  }

  updateDebug(tab, passioFeed);
  scheduleNext();
}

function scheduleNext() {
  let secs = 30;
  const cdEl = document.getElementById('refresh-cd');
  cdTimer = setInterval(() => {
    cdEl.textContent = (--secs) + 's';
    if (secs <= 0) clearInterval(cdTimer);
  }, 1000);
  rfTimer = setTimeout(doRefresh, 30_000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(rfTimer);
    clearInterval(cdTimer);
  } else {
    doRefresh();
  }
});

// ── CTA Spot check ────────────────────────────────────────────────────────────
async function doSpot() {
  const inp = document.getElementById('spot-inp').value.trim();
  const res = document.getElementById('spot-results');
  if (!inp) return;

  localStorage.setItem('transit_spot', inp);
  res.innerHTML = '<p class="card-status">Loading…</p>';

  try {
    const preds = await fetchCTARaw(inp);
    if (!preds.length) {
      res.innerHTML = '<p class="card-status">No arrivals found for this stop.</p>';
      return;
    }

    const byRoute = {};
    for (const p of preds) {
      if (!byRoute[p.rt]) byRoute[p.rt] = { rt: p.rt, des: p.des, dir: p.rtdir, mins: [] };
      const m = p.prdctdn === 'DUE' ? 0 : parseInt(p.prdctdn, 10);
      if (!isNaN(m)) byRoute[p.rt].mins.push(m);
    }

    res.innerHTML = Object.values(byRoute).map(r => {
      const chips = r.mins.slice(0, 3).map(m => {
        if (m <= 0) return '<span class="chip due">Due</span>';
        if (m <= 5) return `<span class="chip soon">${m}</span>`;
        return `<span class="chip">${m}</span>`;
      }).join('');
      return `<div class="card">
        <div class="card-route">Route ${r.rt} — ${r.des}</div>
        <div class="card-stop">${r.dir}</div>
        <div class="arrivals">${chips}</div>
      </div>`;
    }).join('');
  } catch (e) {
    res.innerHTML = `<p class="card-err">${e.message}</p>`;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
try {
  const saved = localStorage.getItem('transit_cfg');
  if (saved) {
    cfg = JSON.parse(saved);
    startApp();
  }
} catch {
  // malformed saved config — stay on config screen
}
